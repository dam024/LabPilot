[GENERAL]

# Output directory where to store all the data. Path is relative to the current working directory
output_directory=tests/tmp
# Path to the local storage
local_storage_path=tests/.local_storage
# File containing the extra code definition
extra_code =  tests/dummy_classes.py

# Indicates if errors must be shown using an alert
error_alert = true
[QT]
# Indicates the frequency at which the plots are refreshed [ms]
plot_refresh_rate = 500