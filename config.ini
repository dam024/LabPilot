[GENERAL]

# Output directory where to store all the data. Path is relative to the current working directory
output_directory=outputs
# Location where to save the plots
plots_output_dir=plots
# experiment data input
data_analysis_folder=saved_outputs
# Folder for the experiments to treat. It must be located in the `data_analysis_folder` !!!
experiment_folder=Simulation_checks
# File containing the extra code definition
extra_code = specific_modules.py
#extra_code = src/views.py

# Indicates if errors must be shown using an alert
error_alert = true
[QT]
# Indicates the frequency at which the plots are refreshed [ms]
plot_refresh_rate = 500
